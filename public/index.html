<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>共創品牌平台</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #fffdf8; --ink: #2b2f2c; --muted: #6f756f; --line: #e3ded2;
    --sage: #7a8b7f; --sage-deep: #55665a; --sand: #b9a58c; --plum: #c98f94; --ok: #4f7d5a; --warn: #b26a3a; --err: #a94442;
    --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(43,47,44,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 ui-sans-serif, -apple-system, "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif; }
  a { color: var(--sage-deep); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 14px; border-radius: 9px; transition: .15s; }
  button:hover { border-color: var(--sage); }
  button.primary { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }
  button.primary:hover { background: #46564b; }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea, select { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); width: 100%; }
  textarea { resize: vertical; min-height: 64px; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }

  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  header .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 99px; }
  header .spacer { flex: 1; }
  .user-switch { display: flex; gap: 4px; background: var(--bg); padding: 3px; border-radius: 99px; border: 1px solid var(--line); }
  .user-switch button { border: none; background: transparent; padding: 5px 12px; border-radius: 99px; }
  .user-switch button.on { background: var(--sage-deep); color: #fff; }

  .layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100% - 57px); }
  aside { border-right: 1px solid var(--line); padding: 20px 16px; background: var(--panel); }
  main { padding: 24px 28px 80px; max-width: 1180px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  h3 { font-size: 18px; margin: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 18px; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .brand-item, .product-item { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; border-radius: 9px; }
  .brand-item.on, .product-item.on { background: var(--bg); border-color: var(--sage); }
  .product-item { padding-left: 24px; font-size: 14px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }

  .spec-head { display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px; }
  .images { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; }
  .images img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
  .images img.hero { grid-row: 1 / 3; }
  .images .ph { display: grid; place-items: center; color: var(--muted); font-size: 13px; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; min-height: 180px; }
  .tagline { font-size: 16px; color: var(--sage-deep); margin: 4px 0 10px; }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px; font-size: 14px; margin-top: 10px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); }
  .chip.agent { background: #eef3ef; border-color: var(--sage); color: var(--sage-deep); }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1px solid rgba(0,0,0,.1); }
  .price { font-size: 22px; font-weight: 600; }

  .thread { max-height: 420px; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
  .msg { display: flex; gap: 10px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; background: var(--sand); color: #fff; }
  .avatar.agent { background: var(--sage-deep); } .avatar.bob { background: var(--plum); }
  .bubble { background: var(--bg); border-radius: 12px; padding: 8px 12px; white-space: pre-wrap; max-width: 760px; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .mention { color: var(--sage-deep); font-weight: 600; }

  .stages { display: flex; gap: 6px; align-items: center; margin: 10px 0 4px; }
  .stage { flex: 1; text-align: center; font-size: 12px; padding: 7px 4px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
  .stage.on { background: #eef3ef; border-color: var(--sage); color: var(--sage-deep); font-weight: 600; animation: pulse 1.4s infinite; }
  .stage.done { background: var(--sage-deep); border-color: var(--sage-deep); color: #fff; }
  .stage.fail { background: #f6e3e2; border-color: var(--err); color: var(--err); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(122,139,127,.35);} 50% { box-shadow: 0 0 0 6px rgba(122,139,127,0);} }
  details.tools { font-size: 13px; margin-top: 6px; } details.tools summary { cursor: pointer; color: var(--muted); }
  .tool-call { padding: 6px 0; border-top: 1px dashed var(--line); }

  .proposal { border-left: 3px solid var(--sage); }
  .diff-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  .diff-table th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .diff-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .diff-table td.before { color: var(--muted); text-decoration: line-through; }
  .diff-table td.after { color: var(--sage-deep); }
  .kind { font-size: 11px; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); }
  .kind.added { color: var(--ok); } .kind.changed { color: var(--warn); } .kind.removed { color: var(--err); }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
  .compare .side { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #fff; }
  .compare .side h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .compare img { width: 100%; border-radius: 8px; border: 1px solid var(--line); }

  .release-box { background: #f8f6f0; border-radius: 10px; padding: 12px 14px; }
  .checkout { display: inline-block; margin-top: 8px; padding: 10px 16px; background: var(--sage-deep); color: #fff; border-radius: 9px; text-decoration: none; }
  .hist { font-size: 13px; } .hist li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 9px; opacity: 0; transition: .3s; }
  .toast.show { opacity: 1; }
  dialog { border: none; border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; width: 520px; max-width: 95vw; }
  dialog::backdrop { background: rgba(43,47,44,.3); }
  dialog label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } aside { border-right: none; border-bottom: 1px solid var(--line); } .grid2, .spec-head, .compare { grid-template-columns: 1fr; } main { padding: 16px; } }
</style>
</head>
<body>
<header>
  <h1>共創品牌平台</h1>
  <span class="tag">built on arcade.ai</span>
  <div class="spacer"></div>
  <span class="muted" style="font-size:13px">目前身分</span>
  <div class="user-switch" id="userSwitch">
    <button data-u="u_alice" class="on">alice</button>
    <button data-u="u_bob">bob</button>
  </div>
</header>

<div class="layout">
  <aside>
    <h2>品牌</h2>
    <div id="brandList"></div>
    <button id="newBrandBtn" style="width:100%;margin-top:6px">＋ 新品牌</button>
    <div id="productSection" style="margin-top:22px;display:none">
      <h2>商品</h2>
      <div id="productList"></div>
      <button id="newProductBtn" style="width:100%;margin-top:6px">＋ 新商品</button>
    </div>
  </aside>

  <main id="main">
    <div class="empty">先建一個品牌和商品，或在左邊選一個。</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<dialog id="brandDlg">
  <h3>新品牌</h3>
  <label>名稱</label><input id="bName" value="山嵐 Mist" />
  <label>slug</label><input id="bSlug" value="mist" />
  <label>mission</label><input id="bMission" value="把東方山水的靜謐帶進日常生活" />
  <label>voice</label><input id="bVoice" value="淡雅、含蓄、帶一點詩意" />
  <label>palette（逗號分隔 hex）</label><input id="bPalette" value="#7A8B7F, #E9E4D8, #B9A58C" />
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button onclick="brandDlg.close()">取消</button><button class="primary" id="bSave">建立</button></div>
</dialog>

<dialog id="productDlg">
  <h3>新商品</h3>
  <label>名稱</label><input id="pName" value="茶園抱枕" />
  <label>tagline</label><input id="pTagline" value="把山裡的清晨帶回家" />
  <label>concept</label><textarea id="pConcept">以台灣高山茶園的晨霧為題的抱枕，適合客廳與臥室。</textarea>
  <label>category</label><input id="pCategory" value="home-textile" />
  <label>target audience</label><input id="pAudience" value="喜歡東方美學、30 到 45 歲的都市上班族" />
  <label>features（每行一個）</label><textarea id="pFeatures">雙面印花
隱形拉鍊</textarea>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button onclick="productDlg.close()">取消</button><button class="primary" id="pSave">建立</button></div>
</dialog>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const state = { user: "u_alice", brands: [], brandId: null, productId: null, product: null, run: null, proposals: {}, release: null, store: null, timer: null };

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "content-type": "application/json", "x-user-id": state.user }, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error?.message ?? res.statusText);
  return json;
}
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); }
function hhmm(ts) { try { return new Date(ts.replace(" ", "T") + "Z").toLocaleTimeString("zh-Hant", { hour: "2-digit", minute: "2-digit" }); } catch { return ts; } }
function who(type, id) { return type === "agent" ? `agent:${id}` : id.replace(/^u_/, ""); }
function avatar(type, id) { const n = who(type, id); return `<div class="avatar ${type === "agent" ? "agent" : id === "u_bob" ? "bob" : ""}">${esc(type === "agent" ? "AI" : n[0].toUpperCase())}</div>`; }

// ---- user switch ----
$("#userSwitch").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.user = b.dataset.u; [...$("#userSwitch").children].forEach((x) => x.classList.toggle("on", x === b)); toast(`現在是 ${who("user", state.user)}`);
});

// ---- brands ----
async function loadBrands() { state.brands = await api("GET", "/brands"); renderSidebar(); }
function renderSidebar() {
  $("#brandList").innerHTML = state.brands.map((b) => `<button class="brand-item ${b.id === state.brandId ? "on" : ""}" data-id="${b.id}"><strong>${esc(b.name)}</strong><div class="muted" style="font-size:12px">${esc(b.identity.voice)}</div></button>`).join("") || `<div class="muted" style="font-size:13px;padding:6px 4px">還沒有品牌</div>`;
  const brand = state.brands.find((b) => b.id === state.brandId);
  $("#productSection").style.display = brand ? "" : "none";
  if (brand) $("#productList").innerHTML = brand.products.map((p) => `<button class="product-item ${p.id === state.productId ? "on" : ""}" data-id="${p.id}">${esc(p.name)}</button>`).join("") || `<div class="muted" style="font-size:13px;padding:6px 4px">還沒有商品</div>`;
}
$("#brandList").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.brandId = b.dataset.id; state.productId = null; renderSidebar(); $("#main").innerHTML = `<div class="empty">選一個商品，或建新商品。</div>`; } });
$("#productList").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) openProduct(b.dataset.id); });
$("#newBrandBtn").onclick = () => brandDlg.showModal();
$("#bSave").onclick = async () => {
  try {
    const b = await api("POST", "/brands", { name: $("#bName").value, slug: $("#bSlug").value + "-" + Date.now().toString(36), identity: { mission: $("#bMission").value, voice: $("#bVoice").value, palette: $("#bPalette").value.split(",").map((s) => s.trim()).filter(Boolean) } });
    brandDlg.close(); state.brandId = b.id; await loadBrands(); toast("品牌建立完成");
  } catch (e) { toast(e.message); }
};
$("#newProductBtn").onclick = () => productDlg.showModal();
$("#pSave").onclick = async () => {
  const brand = state.brands.find((b) => b.id === state.brandId);
  const spec = {
    name: $("#pName").value, tagline: $("#pTagline").value, concept: $("#pConcept").value, category: $("#pCategory").value, target_audience: $("#pAudience").value,
    features: $("#pFeatures").value.split("\n").map((s) => s.trim()).filter(Boolean).map((text, i) => ({ id: `f${i + 1}`, text })),
    materials: [{ id: "m1", name: "棉" }],
    colorways: brand.identity.palette.slice(0, 1).map((hex, i) => ({ id: `c${i + 1}`, name: "品牌主色", hex })),
    price_target: { currency: "USD", min: null, max: null }, images: [], sourcing_notes: "",
  };
  try { const p = await api("POST", `/brands/${state.brandId}/products`, { name: $("#pName").value, spec }); productDlg.close(); await loadBrands(); openProduct(p.id); toast("商品建立完成"); } catch (e) { toast(e.message); }
};

// ---- product view ----
async function openProduct(id) {
  state.productId = id; location.hash = `product=${id}`; state.run = null; state.release = null; state.store = null; state.proposals = {};
  renderSidebar(); await refresh(); startPolling();
}
async function refresh() {
  if (!state.productId) return;
  state.product = await api("GET", `/products/${state.productId}`);
  state.coauthors = await api("GET", `/products/${state.productId}/coauthors`);
  state.revisions = await api("GET", `/products/${state.productId}/revisions`);
  for (const p of state.product.open_proposals) if (!state.proposals[p.id]) state.proposals[p.id] = await api("GET", `/proposals/${p.id}`);
  const lastRunId = [...state.product.messages].reverse().find((m) => m.agent_run_id && m.author_type === "user")?.agent_run_id;
  if (lastRunId && (!state.run || state.run.id !== lastRunId || state.run.status === "running")) state.run = await api("GET", `/agent-runs/${lastRunId}`);
  renderMain();
}
function startPolling() { clearInterval(state.timer); state.timer = setInterval(() => refresh().catch(console.error), 2000); }

function specCard(spec, brand) {
  const img = (role) => spec.images.find((i) => i.role === role);
  const hero = img("hero"), pattern = img("pattern"), closeup = img("closeup");
  const a = spec.arcade ?? {};
  return `
    <div class="spec-head">
      <div class="images">
        ${hero ? `<img class="hero" src="${esc(hero.url)}" alt="hero" />` : `<div class="ph hero" style="grid-row:1/3">還沒有圖。@agent:concept 之後由 arcade.ai 生成</div>`}
        ${pattern ? `<img src="${esc(pattern.url)}" alt="pattern" />` : `<div class="ph">圖樣</div>`}
        ${closeup ? `<img src="${esc(closeup.url)}" alt="closeup" />` : `<div class="ph">特寫</div>`}
      </div>
      <div>
        <h3>${esc(spec.name)}</h3>
        <div class="tagline">${esc(spec.tagline)}</div>
        <div>${esc(spec.concept)}</div>
        <dl class="kv">
          <dt>品類</dt><dd>${esc(spec.category)}${a.categoryName ? ` · <span class="muted">arcade.ai ${esc(a.categoryName)}</span>` : ""}</dd>
          <dt>受眾</dt><dd>${esc(spec.target_audience)}</dd>
          <dt>特色</dt><dd>${spec.features.map((f) => esc(f.text)).join("、")}</dd>
          <dt>材質</dt><dd>${spec.materials.map((m) => esc(m.name)).join("、")}${a.selections?.fabric ? ` <span class="muted">(${esc(Object.values(a.selections).join(" · "))})</span>` : ""}</dd>
          <dt>色彩</dt><dd>${spec.colorways.map((c) => `<span class="swatch" style="background:${esc(c.hex)}"></span>${esc(c.name)}`).join("　")}</dd>
          <dt>風格</dt><dd>${a.modelId ? `arcade.ai <code>${esc(a.modelId)}</code>` : `<span class="muted">尚未生成</span>`}</dd>
          <dt>製作者</dt><dd>${a.maker ? esc(a.maker.name) + " <span class='muted'>via arcade.ai</span>" : `<span class="muted">尚未指定</span>`}</dd>
          <dt>單價</dt><dd>${a.unitPrice ? `<span class="price">${esc(a.unitPrice.currency)} ${esc(a.unitPrice.amount)}</span>` : `<span class="muted">尚未報價</span>`}</dd>
        </dl>
      </div>
    </div>`;
}

function renderMain() {
  const p = state.product; const brand = state.brands.find((b) => b.id === p.brand_id);
  const spec = p.main_head?.content;
  const run = state.run;
  const stages = ["designing", "generating", "building", "done"];
  const stageLabel = { designing: "Claude 設計中", generating: "arcade.ai 生成圖樣", building: "arcade.ai 製作商品", done: "完成" };
  const stageHtml = run ? `
    <div class="stages">${stages.map((s) => { const i = stages.indexOf(run.stage); const j = stages.indexOf(s); const cls = run.status === "failed" && j === i ? "fail" : run.status === "succeeded" || j < i ? "done" : j === i ? "on" : ""; return `<div class="stage ${cls}">${stageLabel[s]}</div>`; }).join("")}</div>
    ${run.status === "failed" ? `<div style="color:var(--err);font-size:13px">${esc(run.error)}</div>` : ""}
    ${run.tool_calls?.length ? `<details class="tools"><summary>工具呼叫 ${run.tool_calls.length} 次</summary>${run.tool_calls.map((t) => `<div class="tool-call"><code>${esc(t.tool)}</code> <span class="muted">${esc(JSON.stringify(t.input)).slice(0, 160)}</span></div>`).join("")}</details>` : ""}` : "";

  const proposals = p.open_proposals.map((pr) => renderProposal(state.proposals[pr.id] ?? pr)).join("");

  $("#main").innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div><span class="muted">${esc(brand?.name ?? "")}</span> <span class="muted">／</span> <strong style="font-size:20px">${esc(p.name)}</strong> <span class="muted" style="font-size:13px">main @ ${esc(p.main_head?.id ?? "")}</span></div>
      <div class="chips">${(state.coauthors ?? []).map((c) => `<span class="chip ${c.type}">${esc(c.handle)} ×${c.revisions}${c.on_behalf_of ? ` <span class="muted">代表 ${esc(c.on_behalf_of.replace(/^u_/, ""))}</span>` : ""}</span>`).join("")}</div>
    </div>

    <div class="card">${spec ? specCard(spec, brand) : `<div class="muted">main 沒有內容</div>`}</div>

    <div class="grid2">
      <div class="card">
        <h2>討論串</h2>
        <div class="thread" id="thread">
          ${p.messages.length ? p.messages.map((m) => `<div class="msg">${avatar(m.author_type, m.author_id)}<div><div class="who">${esc(who(m.author_type, m.author_id))} · ${esc(hhmm(m.created_at))}</div><div class="bubble">${esc(m.body).replace(/@agent:concept/g, '<span class="mention">@agent:concept</span>')}</div></div></div>`).join("") : `<div class="muted">還沒有討論。輸入 <span class="mention">@agent:concept 做成春季限定版，加梅花，用 20x20 亞麻</span> 試試。</div>`}
        </div>
        ${stageHtml}
        <div class="row" style="margin-top:12px">
          <input id="msgInput" placeholder="@agent:concept 做成春季限定版，加梅花，用 20x20 亞麻" style="flex:1" />
          <button class="primary" id="sendBtn" ${run?.status === "running" ? "disabled" : ""}>送出</button>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>Proposals</h2>
          ${proposals || `<div class="muted">沒有待審的 proposal。</div>`}
        </div>
        <div class="card">
          <h2>Release 與開店</h2>
          <div class="row">
            <button id="releaseBtn" ${spec?.arcade?.productId ? "" : "disabled title='main 還沒有 arcade.ai 商品'"}>打 Release</button>
            <button class="primary" id="storeBtn" ${state.release ? "" : "disabled"}>開店（arcade.ai）</button>
          </div>
          ${state.release ? `<div class="release-box" style="margin-top:12px"><strong>${esc(state.release.version)}</strong> · ${esc(state.release.export_payload.title)} · ${state.release.export_payload.images.length} 張圖 · credits: ${state.release.export_payload.credits.map((c) => esc(c.handle)).join("、")}<details style="margin-top:6px"><summary class="muted" style="cursor:pointer;font-size:13px">export_payload</summary><pre class="mono" style="white-space:pre-wrap;font-size:12px">${esc(JSON.stringify(state.release.export_payload, null, 2))}</pre></details></div>` : ""}
          ${state.store ? `<div class="release-box" style="margin-top:12px"><div><strong>${esc(state.store.product.title)}</strong> · ${esc(state.store.product.selectionLabel)} · 製作者 ${esc(state.store.product.maker.name)} · <span class="price" style="font-size:18px">${esc(state.store.product.unitPrice.currency)} ${esc(state.store.product.unitPrice.amount)}</span></div><a class="checkout" href="${esc(state.store.checkout_url)}" target="_blank" rel="noopener">在 arcade.ai 結帳 ↗</a><div class="muted" style="font-size:12px;margin-top:6px">付款即真實下單，由工匠製作出貨。</div></div>` : ""}
        </div>
        <div class="card">
          <h2>main 歷史</h2>
          <ul class="hist" style="margin:0;padding-left:18px">${(state.revisions ?? []).map((r) => `<li><code>${esc(r.id)}</code> ${esc(r.summary)} <span class="muted">— ${esc(who(r.author_type, r.author_id))}${r.on_behalf_of_user_id ? `（代表 ${esc(r.on_behalf_of_user_id.replace(/^u_/, ""))}）` : ""}</span></li>`).join("")}</ul>
        </div>
      </div>
    </div>`;

  $("#sendBtn").onclick = sendMessage;
  $("#msgInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
  $("#releaseBtn").onclick = async () => { try { state.release = await api("POST", `/products/${p.id}/releases`); state.store = null; renderMain(); toast(`Release ${state.release.version} 建立`); } catch (e) { toast(e.message); } };
  $("#storeBtn").onclick = async () => { const b = $("#storeBtn"); b.disabled = true; b.textContent = "arcade.ai 建立結帳中…"; try { state.store = await api("POST", `/releases/${state.release.id}/open-store`); renderMain(); toast("已在 arcade.ai 開店"); } catch (e) { toast(e.message); renderMain(); } };
  document.querySelectorAll("[data-merge]").forEach((b) => b.onclick = async () => { b.disabled = true; try { const r = await api("POST", `/proposals/${b.dataset.merge}/merge`); delete state.proposals[b.dataset.merge]; await refresh(); toast(`已 merge，co-authors：${r.coauthors.map((c) => c.handle).join("、")}`); } catch (e) { toast(e.message); b.disabled = false; } });
  const th = $("#thread"); th.scrollTop = th.scrollHeight;
}

function renderProposal(pr) {
  const src = pr.source?.content, main = pr.main?.content;
  const skip = (path) => path.startsWith("arcade.") || path === "images" || path.startsWith("price_target");
  const rows = (pr.diff ?? []).filter((d) => !skip(d.path)).map((d) => `<tr><td><code>${esc(d.path)}</code></td><td><span class="kind ${d.kind}">${d.kind}</span></td><td class="before">${esc(fmt(d.before))}</td><td class="after">${esc(fmt(d.after))}</td></tr>`).join("");
  const img = (s, role) => s?.images?.find((i) => i.role === role)?.url;
  return `<div class="card proposal">
    <div class="row" style="justify-content:space-between">
      <div><strong>${esc(who(pr.opened_by_type, pr.opened_by_id))}</strong> 提出 <span class="muted" style="font-size:13px">${esc(pr.created_at ? hhmm(pr.created_at) : "")}</span></div>
      <button class="primary" data-merge="${pr.id}">Merge 到 main（以 ${who("user", state.user)} 身分）</button>
    </div>
    <p style="margin:8px 0">${esc(pr.summary)}</p>
    ${src ? `<div class="compare">
      <div class="side"><h4>main 現況</h4>${img(main, "hero") ? `<img src="${esc(img(main, "hero"))}" />` : `<div class="ph" style="min-height:120px;display:grid;place-items:center;color:var(--muted)">沒有圖</div>`}<div style="margin-top:6px"><strong>${esc(main?.name ?? "")}</strong><div class="muted" style="font-size:13px">${esc(main?.tagline ?? "")}</div></div></div>
      <div class="side"><h4>Proposal</h4>${img(src, "hero") ? `<img src="${esc(img(src, "hero"))}" />` : ""}<div style="margin-top:6px"><strong>${esc(src.name)}</strong><div class="muted" style="font-size:13px">${esc(src.tagline)}</div>${src.arcade?.unitPrice ? `<div style="margin-top:4px">${esc(src.arcade.categoryName ?? "")} · ${esc(Object.values(src.arcade.selections ?? {}).join(" · "))} · <strong>${esc(src.arcade.unitPrice.currency)} ${esc(src.arcade.unitPrice.amount)}</strong> · 製作者 ${esc(src.arcade.maker?.name ?? "")}</div>` : ""}</div></div>
    </div>
    <table class="diff-table"><thead><tr><th>欄位</th><th></th><th>之前</th><th>之後</th></tr></thead><tbody>${rows || `<tr><td colspan="4" class="muted">沒有文字欄位變更</td></tr>`}</tbody></table>` : ""}
  </div>`;
}
function fmt(v) { if (v == null) return ""; if (typeof v === "object") return v.text ?? v.name ?? JSON.stringify(v); return String(v); }

async function sendMessage() {
  const input = $("#msgInput"); const body = input.value.trim(); if (!body) return;
  try {
    const r = await api("POST", `/products/${state.productId}/messages`, { body });
    input.value = "";
    if (r.agent_run_id) { state.run = await api("GET", `/agent-runs/${r.agent_run_id}`); toast("concept agent 開始工作"); }
    await refresh();
  } catch (e) { toast(e.message); }
}

loadBrands().then(() => {
  const wanted = new URLSearchParams(location.hash.slice(1)).get("product");
  const hit = wanted && state.brands.find((b) => b.products.some((p) => p.id === wanted));
  const brand = hit || state.brands[0];
  if (brand) { state.brandId = brand.id; renderSidebar(); const pid = hit ? wanted : brand.products[0]?.id; if (pid) openProduct(pid); }
});
</script>
</body>
</html>
